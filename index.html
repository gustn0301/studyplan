<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스터디 플래너</title>
    
    <!-- SVG Favicon 추가 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'%3E%3Cpath d='M21 4H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1zm-1 13H7a1 1 0 0 1 0-2h13v2zm0-4H7a1 1 0 0 1 0-2h13v2zm0-4H7a1 1 0 0 1 0-2h13v2z'/%3E%3Cpath d='M3 6v14a2 2 0 0 0 2 2h15v-2H5a1 1 0 0 1-1-1V6H3z'/%3E%3C/svg%3E">

    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f4f6f8;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .task-checkbox:checked + div {
            text-decoration: line-through;
            color: #9ca3af;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen p-4 md:p-8 flex justify-center">

    <div class="max-w-5xl w-full space-y-6">
        
        <!-- Header Section -->
        <header class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex-1">
                <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-book-open text-indigo-500"></i>
                    스터디 플래너
                </h1>
                <p id="current-date" class="text-slate-500 text-sm mt-1 mb-4"></p>
                
                <!-- Motto Area -->
                <div class="flex items-center gap-2 text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-100 w-full max-w-2xl">
                    <i class="fa-solid fa-quote-left text-indigo-300"></i>
                    <input type="text" id="motto-input" placeholder="나만의 모토나 다짐을 적어보세요!" class="bg-transparent border-none outline-none w-full text-sm font-medium focus:ring-0 placeholder-slate-400">
                    <i class="fa-solid fa-quote-right text-indigo-300"></i>
                </div>
            </div>
            
            <!-- D-Day Counter -->
            <div class="flex items-center gap-3 bg-indigo-50 px-5 py-3 rounded-xl border border-indigo-100">
                <div class="flex flex-col">
                    <span class="text-xs text-indigo-500 font-semibold mb-1">시험 D-Day</span>
                    <div id="d-day-display" class="text-xl font-bold text-indigo-700">D-??</div>
                </div>
                <button onclick="openDDayModal()" class="text-indigo-400 hover:text-indigo-600 transition ml-2">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </header>

        <!-- Progress Section -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
            <div class="flex justify-between items-end mb-2">
                <h2 class="text-lg font-bold text-slate-700">오늘의 달성률</h2>
                <span id="progress-text" class="text-2xl font-black text-indigo-600">0%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden">
                <div id="progress-bar" class="bg-indigo-500 h-4 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
            </div>
            <p id="motivation-message" class="text-sm text-slate-500 mt-3 text-center">오늘도 힘차게 시작해볼까요? 파이팅! 🔥</p>
        </section>

        <!-- Main Content -->
        <div class="space-y-6">
            
            <!-- Task List Section -->
            <section class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 h-full flex flex-col">
                <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-400"></i> 오늘의 할 일
                </h2>
                
                <!-- Task Input Form -->
                <form id="task-form" class="flex gap-2 mb-6">
                    <!-- Custom Subject Dropdown -->
                    <div class="relative w-[35%] sm:w-1/4">
                        <button type="button" id="subject-dropdown-btn" class="w-full flex items-center justify-between px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm text-slate-500 h-full">
                            <span id="subject-dropdown-text" class="truncate">과목 선택</span>
                            <i class="fa-solid fa-chevron-down text-xs ml-2"></i>
                        </button>
                        <div id="subject-dropdown-menu" class="absolute z-10 w-full mt-2 bg-white border border-slate-100 rounded-xl shadow-lg hidden flex-col overflow-hidden py-1">
                            <button type="button" class="subject-option px-4 py-2.5 text-sm text-left hover:bg-yellow-50 text-yellow-700 transition flex items-center gap-2" data-value="국어">
                                <span class="w-2.5 h-2.5 rounded-full bg-yellow-400"></span>국어
                            </button>
                            <button type="button" class="subject-option px-4 py-2.5 text-sm text-left hover:bg-green-50 text-green-700 transition flex items-center gap-2" data-value="수학">
                                <span class="w-2.5 h-2.5 rounded-full bg-green-400"></span>수학
                            </button>
                            <button type="button" class="subject-option px-4 py-2.5 text-sm text-left hover:bg-orange-50 text-orange-700 transition flex items-center gap-2" data-value="영어">
                                <span class="w-2.5 h-2.5 rounded-full bg-orange-400"></span>영어
                            </button>
                            <button type="button" class="subject-option px-4 py-2.5 text-sm text-left hover:bg-purple-50 text-purple-700 transition flex items-center gap-2" data-value="사탐">
                                <span class="w-2.5 h-2.5 rounded-full bg-purple-400"></span>사탐
                            </button>
                            <button type="button" class="subject-option px-4 py-2.5 text-sm text-left hover:bg-blue-50 text-blue-700 transition flex items-center gap-2" data-value="과탐">
                                <span class="w-2.5 h-2.5 rounded-full bg-blue-400"></span>과탐
                            </button>
                            <button type="button" class="subject-option px-4 py-2.5 text-sm text-left hover:bg-slate-50 text-slate-700 transition flex items-center gap-2" data-value="기타">
                                <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>기타
                            </button>
                        </div>
                        <input type="hidden" id="subject-input">
                    </div>

                    <input type="text" id="task-input" placeholder="어떤 공부를 할 계획인가요?" class="flex-1 px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition text-sm" required>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl transition shadow-sm font-medium whitespace-nowrap">
                        추가
                    </button>
                </form>

                <!-- Task List -->
                <div class="flex-1 overflow-y-auto pr-2" style="max-height: 500px;">
                    <ul id="task-list" class="space-y-3">
                        <!-- Tasks will be injected here via JavaScript -->
                        <div class="text-center text-slate-400 py-10 text-sm">
                            아직 등록된 할 일이 없습니다.<br>오늘의 공부 계획을 세워보세요!
                        </div>
                    </ul>
                </div>
            </section>
        </div>
    </div>

    <!-- D-Day Setup Modal (Hidden by default) -->
    <div id="dday-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 transform transition-all scale-95 opacity-0" id="dday-modal-content">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-lg font-bold text-slate-800">D-Day 설정</h3>
                <button onclick="closeDDayModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="mb-5">
                <label class="block text-sm font-medium text-slate-700 mb-2">시험 날짜를 선택해주세요</label>
                <input type="date" id="dday-input" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button onclick="saveDDay()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold transition">
                저장하기
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 사용자님의 Firebase 설정 코드로 교체 완료!
        const firebaseConfig = {
          apiKey: "AIzaSyA5FJ1rA3BvrQmt-d-xcCesyCLMMELaKbo",
          authDomain: "dg-yeolpumta.firebaseapp.com",
          projectId: "dg-yeolpumta",
          storageBucket: "dg-yeolpumta.firebasestorage.app",
          messagingSenderId: "575142322137",
          appId: "1:575142322137:web:0312a6f5640e76404d03c8"
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        // Init Auth
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        // 기본 환경 토큰으로 로그인 시도
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } catch (tokenError) {
                        // 사용자 커스텀 프로젝트(config)를 사용하여 토큰 에러가 발생한 경우 익명 로그인으로 폴백
                        console.warn("커스텀 프로젝트 연동으로 인한 토큰 불일치. 익명 로그인으로 전환합니다.");
                        await signInAnonymously(auth);
                    }
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
            }
        };
        initAuth();

        // --- State Management ---
        let tasks = [];
        let examDate = null;
        let isSyncing = false;

        // Listen for Auth changes
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loadDataFromFirestore();
            } else {
                currentUser = null;
            }
        });

        function getPlannerDocRef() {
            if (!currentUser) return null;
            return doc(db, 'artifacts', appId, 'users', currentUser.uid, 'plannerData', 'current');
        }

        function loadDataFromFirestore() {
            const docRef = getPlannerDocRef();
            if (!docRef) return;

            onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    isSyncing = true;
                    
                    tasks = data.tasks || [];
                    
                    if (data.motto !== undefined) {
                        document.getElementById('motto-input').value = data.motto;
                    }

                    if (data.examDate) {
                        examDate = new Date(data.examDate);
                        examDate.setHours(0, 0, 0, 0);
                        const yyyy = examDate.getFullYear();
                        const mm = String(examDate.getMonth() + 1).padStart(2, '0');
                        const dd = String(examDate.getDate()).padStart(2, '0');
                        document.getElementById('dday-input').value = `${yyyy}-${mm}-${dd}`;
                    } else {
                        examDate = null;
                    }
                    
                    renderTasks();
                    updateProgress();
                    calculateDDay();
                    
                    isSyncing = false;
                }
            }, (error) => {
                console.error("Error fetching data:", error);
            });
        }

        async function saveDataToFirestore() {
            if (!currentUser || isSyncing) return;
            const docRef = getPlannerDocRef();
            if (!docRef) return;

            const mottoValue = document.getElementById('motto-input').value;

            const dataToSave = {
                tasks: tasks,
                motto: mottoValue,
                examDate: examDate ? examDate.toISOString() : null
            };

            try {
                await setDoc(docRef, dataToSave);
            } catch (error) {
                console.error("Error saving data:", error);
            }
        }

        // Add event listener to motto input to save on blur/change
        document.getElementById('motto-input').addEventListener('change', saveDataToFirestore);

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            updateCurrentDate();
            renderTasks();
            initDropdown();
        });

        // --- Custom Dropdown Logic ---
        function initDropdown() {
            const dropdownBtn = document.getElementById('subject-dropdown-btn');
            const dropdownMenu = document.getElementById('subject-dropdown-menu');
            const dropdownText = document.getElementById('subject-dropdown-text');
            const subjectInput = document.getElementById('subject-input');

            dropdownBtn.addEventListener('click', () => {
                dropdownMenu.classList.toggle('hidden');
                dropdownMenu.classList.toggle('flex');
            });

            document.querySelectorAll('.subject-option').forEach(option => {
                option.addEventListener('click', (e) => {
                    const value = e.currentTarget.dataset.value;
                    subjectInput.value = value;
                    
                    dropdownText.innerHTML = `<div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full ${getSubjectDotColor(value)}"></span>${value}</div>`;
                    dropdownText.className = getSubjectTextColor(value);
                    
                    dropdownMenu.classList.add('hidden');
                    dropdownMenu.classList.remove('flex');
                });
            });

            // Close dropdown when clicking outside
            document.addEventListener('click', (e) => {
                if (!dropdownBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
                    dropdownMenu.classList.add('hidden');
                    dropdownMenu.classList.remove('flex');
                }
            });
        }

        function getSubjectDotColor(subject) {
            switch(subject) {
                case '국어': return 'bg-yellow-400';
                case '수학': return 'bg-green-400';
                case '영어': return 'bg-orange-400';
                case '사탐': return 'bg-purple-400';
                case '과탐': return 'bg-blue-400';
                case '기타': return 'bg-slate-400';
                default: return 'bg-slate-400';
            }
        }

        function getSubjectTextColor(subject) {
            switch(subject) {
                case '국어': return 'text-yellow-700 font-medium';
                case '수학': return 'text-green-700 font-medium';
                case '영어': return 'text-orange-700 font-medium';
                case '사탐': return 'text-purple-700 font-medium';
                case '과탐': return 'text-blue-700 font-medium';
                case '기타': return 'text-slate-700 font-medium';
                default: return 'text-slate-500';
            }
        }

        function getSubjectBgColor(subject) {
            switch(subject) {
                case '국어': return 'bg-yellow-100 text-yellow-700';
                case '수학': return 'bg-green-100 text-green-700';
                case '영어': return 'bg-orange-100 text-orange-700';
                case '사탐': return 'bg-purple-100 text-purple-700';
                case '과탐': return 'bg-blue-100 text-blue-700';
                case '기타': return 'bg-slate-100 text-slate-700';
                default: return 'bg-slate-100 text-slate-600';
            }
        }

        // --- Date & Time ---
        function updateCurrentDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('current-date').textContent = now.toLocaleDateString('ko-KR', options);
        }

        // --- D-Day Logic ---
        window.openDDayModal = function openDDayModal() {
            const modal = document.getElementById('dday-modal');
            const content = document.getElementById('dday-modal-content');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            // Small delay for animation
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        window.closeDDayModal = function closeDDayModal() {
            const modal = document.getElementById('dday-modal');
            const content = document.getElementById('dday-modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 200);
        }
        window.saveDDay = function saveDDay() {
            const inputDate = document.getElementById('dday-input').value;
            if (inputDate) {
                examDate = new Date(inputDate);
                examDate.setHours(0, 0, 0, 0); // Normalize to start of day
                calculateDDay();
                saveDataToFirestore();
                closeDDayModal();
            }
        }

        function calculateDDay() {
            if (!examDate) return;
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const diffTime = examDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            const displayEl = document.getElementById('d-day-display');
            if (diffDays > 0) {
                displayEl.textContent = `D-${diffDays}`;
                displayEl.className = "text-xl font-bold text-indigo-700";
            } else if (diffDays === 0) {
                displayEl.textContent = `D-Day`;
                displayEl.className = "text-xl font-bold text-red-500 animate-pulse";
            } else {
                displayEl.textContent = `D+${Math.abs(diffDays)}`;
                displayEl.className = "text-xl font-bold text-slate-500";
            }
        }

        // --- Task Management ---
        const taskForm = document.getElementById('task-form');
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const subjectEl = document.getElementById('subject-input');
            const taskEl = document.getElementById('task-input');
            const dropdownBtn = document.getElementById('subject-dropdown-btn');
            
            // Validate custom dropdown
            if (subjectEl.value === '') {
                dropdownBtn.classList.add('ring-2', 'ring-red-400');
                setTimeout(() => dropdownBtn.classList.remove('ring-2', 'ring-red-400'), 1500);
                return;
            }

            if (taskEl.value.trim() === '') return;

            const newTask = {
                id: Date.now().toString(),
                subject: subjectEl.value,
                text: taskEl.value.trim(),
                completed: false
            };

            tasks.push(newTask);
            
            // Reset form
            subjectEl.value = ''; 
            const dropdownText = document.getElementById('subject-dropdown-text');
            dropdownText.innerHTML = '과목 선택';
            dropdownText.className = 'text-slate-500 truncate';

            taskEl.value = '';
            taskEl.focus();
            
            renderTasks();
            updateProgress();
            saveDataToFirestore();
        });

        window.toggleTask = function toggleTask(id) {
            tasks = tasks.map(task => 
                task.id === id ? { ...task, completed: !task.completed } : task
            );
            renderTasks();
            updateProgress();
            saveDataToFirestore();
        }

        window.deleteTask = function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            renderTasks();
            updateProgress();
            saveDataToFirestore();
        }

        function renderTasks() {
            const taskList = document.getElementById('task-list');
            
            if (tasks.length === 0) {
                taskList.innerHTML = `
                    <div class="text-center text-slate-400 py-10 text-sm">
                        <i class="fa-solid fa-clipboard-list text-3xl mb-3 opacity-50"></i><br>
                        아직 등록된 할 일이 없습니다.<br>오늘의 공부 계획을 세워보세요!
                    </div>`;
                return;
            }

            taskList.innerHTML = '';
            tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `group flex items-center justify-between p-3 sm:p-4 rounded-xl border transition-all ${task.completed ? 'bg-slate-50 border-transparent opacity-75' : 'bg-white border-slate-200 hover:border-indigo-300 shadow-sm'}`;
                
                const subjectBadgeColor = getSubjectBgColor(task.subject);

                li.innerHTML = `
                    <label class="flex items-center gap-3 cursor-pointer flex-1 overflow-hidden">
                        <div class="relative flex items-center justify-center">
                            <input type="checkbox" class="peer appearance-none w-5 h-5 border-2 border-slate-300 rounded-full checked:bg-indigo-500 checked:border-indigo-500 transition cursor-pointer" 
                                ${task.completed ? 'checked' : ''} 
                                onchange="toggleTask('${task.id}')">
                            <i class="fa-solid fa-check absolute text-white text-xs opacity-0 peer-checked:opacity-100 pointer-events-none transition"></i>
                        </div>
                        <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-3 flex-1 min-w-0 transition-all ${task.completed ? 'line-through text-slate-400' : 'text-slate-700'}">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-md whitespace-nowrap w-max ${subjectBadgeColor} ${task.completed ? 'opacity-50 grayscale' : ''}">${escapeHtml(task.subject)}</span>
                            <span class="text-sm font-medium truncate mt-0.5 sm:mt-0">${escapeHtml(task.text)}</span>
                        </div>
                    </label>
                    <button onclick="deleteTask('${task.id}')" class="text-slate-300 hover:text-red-500 p-2 opacity-0 group-hover:opacity-100 transition focus:opacity-100 ml-2">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                taskList.appendChild(li);
            });
        }

        function updateProgress() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
            
            document.getElementById('progress-bar').style.width = `${percentage}%`;
            
            // Animate number counting
            const progressText = document.getElementById('progress-text');
            progressText.textContent = `${percentage}%`;

            // Update motivation message based on progress
            const msgEl = document.getElementById('motivation-message');
            if (total === 0) {
                msgEl.textContent = "오늘도 힘차게 시작해볼까요? 파이팅! 🔥";
            } else if (percentage === 0) {
                msgEl.textContent = "첫 번째 목표를 달성해 보세요! 할 수 있어요 💪";
            } else if (percentage < 50) {
                msgEl.textContent = "순조로운 출발입니다! 계속 달려봐요 🏃‍♂️";
            } else if (percentage < 100) {
                msgEl.textContent = "절반 이상 달성! 고지가 눈앞에 보입니다 ✨";
            } else {
                msgEl.textContent = "완벽해요! 오늘의 목표를 모두 달성했습니다 🏆";
                confettiEffect();
            }
        }

        // Simple helper to prevent XSS
        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // --- Fun Extra: Confetti for 100% ---
        function confettiEffect() {
            // Simple falling shapes logic if we wanted to build it from scratch,
            // but for simplicity without external heavy libs, we just change the background color briefly
            const progressSection = document.getElementById('progress-bar').parentElement.parentElement;
            progressSection.classList.add('ring-4', 'ring-indigo-300', 'transition-all');
            setTimeout(() => {
                progressSection.classList.remove('ring-4', 'ring-indigo-300');
            }, 1500);
        }

    </script>
</body>
</html>
